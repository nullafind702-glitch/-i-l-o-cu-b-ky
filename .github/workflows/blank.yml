name: 🚀 SERVER nullamc

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Thời gian (vd: 90m, 120m, 2h)'
        required: false
        default: '90m'
        type: string

jobs:
  nullamc-RDP-Setup:
    runs-on: windows-latest

    steps:
      - name: 🚀 KHỞI ĐỘNG
        shell: pwsh
        run: |
          chcp 65001 > $null
          Write-Host "`n🚀 nullamc RDP SERVER" -ForegroundColor Yellow
          Write-Host "Powered by nullamc" -ForegroundColor Green
          Write-Host "Run ID: ${{ github.run_id }}" -ForegroundColor Cyan
          Write-Host "Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta

      - name: ⚙️ BẬT RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-Service TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue
          Write-Host "✅ RDP đã bật thành công" -ForegroundColor Green

      - name: 👤 TẠO USER PREMIUM
        shell: pwsh
        run: |
          $pass = "@Nullamc123445678"

          Remove-LocalUser -Name "nullamc" -ErrorAction SilentlyContinue

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force

          New-LocalUser `
            -Name "nullamc" `
            -Password $secure `
            -FullName "nullamc RDP Premium" `
            -AccountNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "nullamc"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "nullamc"

          Enable-LocalUser -Name "nullamc"

          echo "RDP_USER=nullamc" >> $env:GITHUB_ENV
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV

          Write-Host "👤 User: nullamc"
          Write-Host "🔐 Pass: $pass"

      - name: 🌐 SETUP TAILSCALE
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_KEY) {
            Write-Host "❌ Thiếu Tailscale key!" -ForegroundColor Red
            exit 1
          }

          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -OutFile $msi

          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Start-Sleep 8

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=$env:TS_KEY `
            --hostname="nullamc-${{ github.run_id }}" `
            --accept-dns

          # Lấy IP retry
          $ip = $null
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
            if ($ip) { break }
            Start-Sleep 3
          }

          if (-not $ip) {
            Write-Host "❌ Không lấy được IP!" -ForegroundColor Red
            exit 1
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "🌐 IP: $ip"

      - name: 🎉 THÔNG TIN KẾT NỐI
        shell: pwsh
        run: |
          Write-Host "`n========= RDP + TAILSCALE =========" -ForegroundColor Magenta
          Write-Host "🌐 IP       : $env:TAILSCALE_IP" -ForegroundColor Green
          Write-Host "👤 Username : $env:RDP_USER" -ForegroundColor Green
          Write-Host "🔐 Password : $env:RDP_PASS" -ForegroundColor Green
          Write-Host "📍 Port     : 3389" -ForegroundColor Green
          Write-Host "⏱️  Time     : ${{ github.event.inputs.duration }}" -ForegroundColor Green
          Write-Host "===================================" -ForegroundColor Magenta

      - name: ⏳ GIỮ MÁY CHẠY
        shell: pwsh
        run: |
          $inputDuration = "${{ github.event.inputs.duration }}".Trim()

          if ($inputDuration -match "^(\d+)([mhMH]?)$") {
            $value = [int]$matches[1]
            $unit  = $matches[2]

            if ($unit -eq 'h' -or $unit -eq 'H') {
              $minutes = $value * 60
              $unitText = "giờ"
            } else {
              $minutes = $value
              $unitText = "phút"
            }
          } else {
            $minutes = 90
            $unitText = "phút"
            Write-Host "⚠️ Input sai → dùng mặc định 90 phút" -ForegroundColor Yellow
          }

          $seconds = $minutes * 60

          Write-Host "⏳ Giữ máy chạy trong $minutes $unitText ($seconds giây)..." -ForegroundColor Yellow
          Write-Host "📥 Input: $inputDuration" -ForegroundColor Gray

          Start-Sleep -Seconds $seconds

          Write-Host "`n⏰ Hết thời gian!" -ForegroundColor Red

      - name: 🧹 CLEANUP
        if: always()
        shell: pwsh
        run: |
          Write-Host "🧹 Cleaning..."

          Disable-LocalUser -Name "nullamc" -ErrorAction SilentlyContinue
          Remove-LocalUser -Name "nullamc" -ErrorAction SilentlyContinue

          if (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe") {
            & "$env:ProgramFiles\Tailscale\tailscale.exe" down --accept-risk=all
          }

          Stop-Service TermService -Force -ErrorAction SilentlyContinue

          Write-Host "✅ Done"
