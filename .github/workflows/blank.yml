name: 🚀 SERVER nullamc

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Thời gian sử dụng'
        required: false
        default: '1_Giờ_30_Phút_(90m)'
        type: choice
        options:
          - '30_Phút_(30m)'
          - '1_Giờ_(60m)'
          - '1_Giờ_30_Phút_(90m)'
          - '2_Giờ_(120m)'
          - '2_Giờ_30_Phút_(150m)'
          - '3_Giờ_(180m)'
          - '3_Giờ_30_Phút_(210m)'
          - '4_Giờ_(240m)'
          - '4_Giờ_30_Phút_(270m)'
          - '5_Giờ_(300m)'
          - '5_Giờ_30_Phút_(330m)'
          - '6_Giờ_(360m)'

jobs:
  nullamc-RDP-Setup:
    runs-on: windows-latest
    steps:
      - name: KHỞI ĐỘNG HỆ THỐNG
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          chcp 65001 > $null
          
          Write-Host "`n nullamc RDP SERVER" -ForegroundColor Yellow
          Write-Host " Powered by nullamc" -ForegroundColor Green
          Write-Host " Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta

      - name: CẤU HÌNH HỆ THỐNG
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService
          Write-Host " Cấu hình RDP hoàn tất" -ForegroundColor Green

      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        shell: pwsh
        run: |
          $matKhau = "@nullamc2K9"
          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force

          Remove-LocalUser -Name "nullamc" -ErrorAction SilentlyContinue

          New-LocalUser `
              -Name "nullamc" `
              -Password $securePass `
              -FullName "nullamc Premium" `
              -AccountNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "nullamc"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "nullamc"

          Enable-LocalUser -Name "nullamc"

          echo "RDP_USER=nullamc" >> $env:GITHUB_ENV
          echo "RDP_PASS=$matKhau" >> $env:GITHUB_ENV

      - name: 🌐 THIẾT LẬP TAILSCALE
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          
          Start-Sleep -Seconds 10

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=nullamc-$env:GITHUB_RUN_ID

          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          Write-Host "🌐 IP: $env:TAILSCALE_IP"
          Write-Host "👤 User: nullamc"
          Write-Host "🔐 Pass: $env:RDP_PASS"
          Write-Host "📍 Port: 3389"

      - name: ⏳ GIỮ SESSION
        shell: pwsh
        run: |
          Start-Sleep -Seconds 18000

      - name: DỌN DẸP
        if: always()
        run: |
          Disable-LocalUser -Name "nullamc" -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\Tailscale\tailscale.exe" down --accept-risk=all
          Stop-Service TermService -Force -ErrorAction SilentlyContinue
